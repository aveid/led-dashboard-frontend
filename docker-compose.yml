# =============================================================================
# docker-compose.yml — весь проект одной командой: `docker compose up -d --build`.
#
# За что отвечает: поднимает всё — backend, frontend и их зависимости:
#   • db       — PostgreSQL с расширением PostGIS (данные и гео-точки экранов);
#   • minio    — S3-совместимое хранилище файлов (фото экранов, сканы договоров);
#   • backend  — FastAPI-приложение (применяет миграции и запускает сервер);
#   • frontend — Flutter Web, собранный в статику и отданный через nginx.
#
# ЕДИНСТВЕННОЕ, что нужно поменять перед разворачиванием в локальной сети —
# переменная LAN_IP в .env (см. .env.example). Она подставляется везде через
# ${LAN_IP}: в адрес MinIO для presigned-ссылок, в CORS backend'а, в CORS MinIO
# и в адрес API, "запекаемый" в сборку фронта. Никаких других правок не нужно.
# =============================================================================

services:
  # --- База данных с гео-расширением ---
  db:
    image: postgis/postgis:16-3.4   # PostgreSQL 16 + PostGIS 3.4 (нужен для Geometry)
    environment:
      POSTGRES_USER: led
      POSTGRES_PASSWORD: led
      POSTGRES_DB: led_dashboard
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data   # данные переживают перезапуск контейнера
    healthcheck:
      # backend ждёт этого healthcheck (depends_on: condition: service_healthy),
      # чтобы не пытаться применить миграции раньше, чем БД готова принимать соединения.
      test: ["CMD-SHELL", "pg_isready -U led -d led_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- Хранилище файлов (S3-совместимое), для фото и договоров ---
  minio:
    # MinIO больше не публикует образ на Docker Hub без логина (лицензионное
    # изменение 2024): docker.io/minio/minio тянется с "pull access denied".
    # quay.io/minio/minio — актуальный публичный источник того же образа.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
      # CORS для presigned-превью: браузер грузит картинки/файлы напрямую из
      # MinIO, минуя backend. Без этого заголовка браузер режет ответ
      # ("No 'Access-Control-Allow-Origin' header") → заглушка на карточке.
      # Значение — реальный адрес, с которого отдаётся фронт (см. LAN_IP в .env).
      MINIO_API_CORS_ALLOW_ORIGIN: "http://${LAN_IP}:8080"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # веб-консоль MinIO
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # --- Backend (FastAPI): применяет миграции и поднимает сервер ---
  backend:
    build:
      # Соседняя папка led-dashboard-backend/ рядом с led-dashboard-frontend/.
      context: ../led-dashboard-backend
      # Нет Dockerfile в корне backend — собираем по devops/Dockerfile
      # (приватный registry Megacom + корпоративный прокси, см. сам файл).
      dockerfile: devops/Dockerfile
    env_file:
      - ../led-dashboard-backend/.env   # SECRET_KEY, время жизни токена, демо-учётка (см. .env.example)
    environment:
      # Внутри сети compose сервис БД называется "db", а не "localhost".
      DATABASE_URL: postgresql+psycopg://led:led@db:5432/led_dashboard
      # Адреса фронтенда для CORS — реальный адрес, с которого отдаётся фронт.
      CORS_ORIGINS: "http://${LAN_IP}:8080"
      # Объектное хранилище (MinIO). Внутренний адрес — имя сервиса "minio" в
      # сети compose; публичный — адрес, до которого дотягивается браузер
      # пользователя (реальный IP сервера в локальной сети, не localhost —
      # иначе presigned-ссылки на фото/договоры будут битыми у всех, кроме
      # того, кто физически на сервере). Ключи совпадают с
      # MINIO_ROOT_USER/PASSWORD сервиса minio.
      S3_BUCKET: led-attachments
      S3_INTERNAL_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://${LAN_IP}:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_REGION: us-east-1
      S3_PRESIGN_EXPIRE_SECONDS: "3600"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s   # даём время на применение миграций при первом старте
    restart: unless-stopped

  # --- Frontend (Flutter Web): собран в статику, отдаётся через nginx ---
  frontend:
    build:
      context: .   # этот файл уже лежит в led-dashboard-frontend/
      dockerfile: Dockerfile
      args:
        # Адрес backend'а "запекается" в сборку на этапе flutter build web —
        # рантайм-переменные окружения Flutter Web не читает. Смена LAN_IP
        # требует пересборки образа: docker compose up -d --build frontend.
        API_URL: http://${LAN_IP}:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  minio_data:
