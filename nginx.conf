# =============================================================================
# nginx.conf — раздача статики Flutter Web как SPA.
#
# Ключевая строка — try_files ... /index.html: go_router использует
# client-side роутинг (адреса вида /dashboard, /landlords без реальных файлов
# на диске). Без этого фолбэка обновление страницы (F5) не на "/" даёт 404 от
# nginx вместо того, чтобы отдать index.html и дать Flutter самому разобрать
# маршрут.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-фолбэк: любой путь, которого нет как файла, отдаём как index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статические ассеты Flutter (js/css/шрифты/иконки) — кэш на стороне
    # браузера. Имена файлов у Flutter содержат хэш содержимого, поэтому
    # долгий кэш безопасен: при пересборке имена файлов меняются сами.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|json|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html — никогда не кэшируем, иначе после пересборки браузер будет
    # упорно грузить старые пути к js/css с прошлой сборки.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
